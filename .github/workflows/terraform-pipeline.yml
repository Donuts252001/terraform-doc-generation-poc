name: Generate Terraform Infrastructure Documentation From Plan

on:
  push:
    branches:
      - release/dev

  workflow_dispatch:

jobs:

  terraform-plan:

    runs-on: ubuntu-latest

    env:
      TF_VAR_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Terraform Init
        working-directory: terraform-iaac
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform-iaac
        run: terraform plan -out=tf-plan -input=false
        env:
            TF_LOG: INFO

      - name: Generate Terraform JSON
        working-directory: terraform-iaac
        run: terraform show -json tfplan > tf-plan.json

